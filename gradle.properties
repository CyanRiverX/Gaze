org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableJetifier=false

kotlin.code.style=official

# 关闭 AGP 往 APK 写入 SDK 依赖元数据（DEPENDENCY_INFO / SDKP 块）。
# 该块由 :app:sdkReleaseDependencyData 生成，内容每次构建都不同（不可复现），
# 导致同一 HEAD 连续构建 md5 各不相同。本项目纯本地、不上架 Google Play，
# 这块元数据没有用途。关闭后构建可复现（2026-11-20 实测）。
android.includeDependencyInfoInApks=false