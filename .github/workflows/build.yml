# 最简 CI：只做两件事 —— 能编译通过 + 出一份可装的 debug APK
# 不跑单元测试（工程里还没有 src/test），lint 只出报告不卡构建。
#
# 两个刻意的取舍：
#   1. 用 `gradle` 而不是 `./gradlew` —— 仓库在 Windows 上开发，gradlew 在 git 里的
#      权限位是 100644（不可执行），到 ubuntu runner 上直接 ./gradlew 会 Permission denied。
#   2. 显式装 compileSdk 36 与 build-tools 35.0.0 —— setup-android 默认只装最小集合，
#      不装 platform 36 会报 "Failed to find target with hash string 'android-36'"。
name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Assemble debug
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Lint (report only, never fails the build)
        run: gradle lintDebug --no-daemon
        continue-on-error: true

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn